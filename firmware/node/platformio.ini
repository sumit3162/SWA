; bed node (esp32 + max30102)
; one env per bed, just copy a block and change BED_ID

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../lib
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2

[env:bed1]
build_flags = -DBED_ID=1

[env:bed2]
build_flags = -DBED_ID=2

[env:bed3]
build_flags = -DBED_ID=3
